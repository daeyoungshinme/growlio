repos:
  # ── Backend: Python ──────────────────────────────────────────
  # ruff: ruff-pre-commit의 rev 핀 대신 local system 훅 — backend/.venv(uv.lock)의 ruff를 그대로 써서
  # CI(`uv run ruff`)와 버전이 갈라지지 않는다. rev 핀은 Dependabot이 갱신하지 않았다. venv 없으면 스킵.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        language: system
        entry: >-
          bash -c 'if [ -x backend/.venv/Scripts/ruff.exe ] || [ -x backend/.venv/bin/ruff ]; then uv run --project backend ruff check --fix --unsafe-fixes "$@"; else echo "SKIP: backend/.venv 없음 — make install-backend 실행 필요" && exit 0; fi' dummy
        files: ^backend/
        types: [python]
      - id: ruff-format
        name: ruff format
        language: system
        entry: >-
          bash -c 'if [ -x backend/.venv/Scripts/ruff.exe ] || [ -x backend/.venv/bin/ruff ]; then uv run --project backend ruff format "$@"; else echo "SKIP: backend/.venv 없음 — make install-backend 실행 필요" && exit 0; fi' dummy
        files: ^backend/
        types: [python]

  # mypy: mirrors-mypy 대신 local system 훅 사용 — backend/.venv에 설치된 정확한 버전을 그대로 사용해야
  # `uv run mypy app/`(CI·make typecheck에서 사용)와 결과가 항상 일치함. venv 없으면 스킵.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        language: system
        entry: >-
          bash -c 'if [ -x backend/.venv/Scripts/mypy.exe ] || [ -x backend/.venv/bin/mypy ]; then cd backend && uv run mypy app/; else echo "SKIP: backend/.venv 없음 — make install-backend 실행 필요" && exit 0; fi'
        files: ^backend/app/
        pass_filenames: false

  # ── Frontend: TypeScript / JS ─────────────────────────────────
  # ESLint: mirrors-eslint 대신 local system 훅 사용 — frontend/node_modules의 정확한 버전(eslint@10 + 모든 플러그인)을 그대로 사용해야
  # parserOptions.project: true (타입 인식 rules)가 정상 동작. node_modules 없으면 스킵.
  - repo: local
    hooks:
      - id: eslint
        name: ESLint (frontend)
        language: system
        entry: >-
          bash -c 'if [ -x frontend/node_modules/.bin/eslint ]; then cd frontend && ./node_modules/.bin/eslint src --fix --max-warnings 0; else echo "SKIP: frontend/node_modules 없음 — npm install 실행 필요" && exit 0; fi'
        files: ^frontend/src/
        pass_filenames: false

  - repo: local
    hooks:
      - id: prettier
        name: Prettier (frontend)
        language: system
        entry: >-
          bash -c 'if [ -x frontend/node_modules/.bin/prettier ]; then frontend/node_modules/.bin/prettier --write "$@"; else echo "SKIP: frontend/node_modules 없음 — npm install 실행 필요" && exit 0; fi' dummy
        files: ^frontend/src/
        types_or: [javascript, jsx, ts, tsx, css]

  # ── 공통 ────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^frontend/android/
      - id: end-of-file-fixer
        exclude: ^frontend/android/
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$
