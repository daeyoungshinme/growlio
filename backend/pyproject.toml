[project]
name = "growlio"
version = "0.1.0"
description = "Growlio — 자산관리 + 포트폴리오 자동매매 앱"
requires-python = ">=3.13"

dependencies = [
    # Web framework
    "fastapi>=0.111.0,<1.0.0",
    # uvicorn[standard]를 풀어 쓴 것 — extras 표기는 Dependabot(uv)이 "No update possible"로 건너뛴다(plans/86)
    "uvicorn>=0.29.0,<1.0.0",
    "uvloop>=0.15.1,<1.0.0; sys_platform != 'win32' and sys_platform != 'cygwin' and platform_python_implementation != 'PyPy'",
    "httptools>=0.6.3,<1.0.0",
    "python-dotenv>=0.13,<2.0",
    "colorama>=0.4,<1.0; sys_platform == 'win32'",
    # Database
    "sqlalchemy>=2.0.0,<3.0.0",
    "greenlet>=1,<4.0.0",  # sqlalchemy[asyncio]
    "asyncpg>=0.29.0,<1.0.0",
    "alembic>=1.13.0,<2.0.0",
    # Validation & Settings
    "pydantic>=2.7.0,<3.0.0",
    "email-validator>=2.0.0,<3.0.0",  # pydantic[email]
    "pydantic-settings>=2.2.0,<3.0.0",
    # HTTP Client
    "httpx>=0.27.0,<1.0.0",
    # 네이버 금융 스크래핑(price_sync_sources/dividend.sync_sources)에서 직접 import — yfinance/pykrx 전이 의존에 기대지 않고 명시
    "requests>=2.31.0,<3.0.0",
    # Scheduler
    "apscheduler>=3.10.0,<4.0.0",
    # Auth
    "PyJWT>=2.8.0,<3.0.0",
    # Encryption (KIS credentials)
    "cryptography>=42.0.0,<51.0.0",
    # Logging
    "structlog>=24.0.0,<27.0.0",
    # Date utils
    "python-dateutil>=2.9.0,<5.0.0",
    # Stock price data (API 키 불필요 — Yahoo Finance). 비공식 스크래핑 기반이라 breaking change 잦음 — 상한 필수
    "yfinance>=0.2.66,<0.3.0",
    # KRX 공식 데이터 (ETF 분배금 이력 조회 — 인증 불필요)
    "pykrx>=1.0.47,<2.0.0",
    # ETF 분배금/배당율 fallback 데이터 소스 (네이버 금융 기반, import: FinanceDataReader)
    "finance-datareader>=0.9,<1.0",
    # Rate limiting
    "slowapi>=0.1.9,<0.2.0",
    # Retry logic for external APIs
    "tenacity>=8.3.0,<10.0.0",
    # Error tracking
    "sentry-sdk>=2.0.0,<3.0.0",  # [fastapi] extra는 fastapi 직접 의존과 같아 생략
    # Metrics
    "prometheus-client>=0.20.0,<1.0.0",
    # FCM 푸시 알림 (선택적 — FIREBASE_CREDENTIALS_JSON 환경변수 설정 시 활성화)
    "firebase-admin>=6.5.0,<8.0.0",
    # 포트폴리오 최적화 — 효율적 프론티어 MVO
    "scipy>=1.12.0,<2.0.0",
    # 수치 계산 — estimation.py 등에서 직접 import (scipy/yfinance/pykrx 전이 의존이 아닌 직접 의존이므로 명시)
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.0.0,<3.0.0",
    # XML 파서 (DART API — XXE/XML bomb 방어)
    "defusedxml>=0.7.1,<1.0.0",
    # KRX·NYSE 휴장일 — 장 개장 판정(market_hours). python-dateutil<3을 요구해 dateutil은 2.9에 묶인다(plans/122 A1)
    "holidays>=0.60,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.23.0,<2.0.0",
    # pytest-httpx는 httpx 마이너 버전에 강하게 묶여 있어 상한 필요
    "pytest-httpx>=0.30.0,<0.37.0",
    "pytest-timeout>=2.3.0,<3.0.0",
    # starlette.testclient(=fastapi.testclient)가 우선 import — 없으면 httpx 폴백 + 폐기 경고
    "httpx2>=2.16.0,<3.0.0",
    "ruff>=0.17.0,<0.18.0",
    "mypy>=1.10.0,<3.0.0",
    "bandit>=1.7.0,<2.0.0",
    "pip-audit>=2.7.0,<3.0.0",
    "pytest-cov>=5.0.0,<8.0.0",
    # make install-backend가 훅 설치에 사용 — venv 재생성 시 사라지지 않게 명시
    "pre-commit>=4.0.0,<5.0.0",
    # uvicorn[standard] 중 개발에만 쓰는 것 — 운영은 --reload도 WebSocket 라우트도 없다(plans/114 C3)
    "watchfiles>=0.20,<2.0",  # uvicorn --reload (make dev-backend, dev.sh)
    "websockets>=10.4,<18.0",
]

[build-system]
# 빌드 백엔드도 메이저 상한을 둔다 — CI의 uv sync가 editable 설치 때 최신 hatchling을 받아 코드와 무관하게 깨지지 않게(plans/118 D5)
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# app/ 안의 `*_test.py`(예: rebalancing/alert_test.py)가 테스트 모듈로 수집되지 않게
testpaths = ["tests"]
addopts = "--tb=short"
# 커버리지는 CI(.github/workflows/ci.yml)와 `make test-backend-cov`에서만 측정 —
# 모든 로컬 pytest 실행(-k·--collect-only·단일 파일)에 강제되던 마찰 제거.
timeout = 60
markers = [
    "db: 실 Postgres(GROWLIO_TEST_DATABASE_URL)가 있어야 도는 테스트 — 없으면 skip (plans/118 D1)",
]
timeout_method = "thread"
asyncio_default_fixture_loop_scope = "function"
# 동기 메서드(db.add 등)를 AsyncMock으로 둬서 코루틴이 버려지는 테스트 mock 실수를 실패로 잡는다
filterwarnings = [
    "error:coroutine .* was never awaited:RuntimeWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 91  # 실측 93%(2026-11-06, main.py 포함) − 2 — 올릴 때도 실측보다 조금 낮게
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py313"
line-length = 120
# ruff 0.17부터 Markdown 코드블록도 포맷 대상 — CLAUDE.md의 한 줄 압축 예시가 쪼개지지 않게 제외
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90", "ASYNC", "PT", "RUF100"]
ignore = [
    "E712",   # SQLAlchemy boolean 비교 (Model.is_active == True) 허용
    "B008",   # FastAPI Depends() 호출 허용
    "SIM108", # 삼항 연산자 강제 변환 비활성화
    "PT001",  # pytest fixture 괄호 스타일 유연하게
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["F401", "F811"]

[tool.mypy]
python_version = "3.13"
platform = "linux"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "tests/"]

# 점진적 strict 옵션 (전체 적용 — 사이드이펙트 적은 항목만)
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# 타입이 잘 정의된 모듈에 선택적 strict 적용
[[tool.mypy.overrides]]
module = ["app.utils.*", "app.schemas.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
