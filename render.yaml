services:
  - type: web
    name: growlio-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    # main 푸시마다가 아니라 GitHub 체크(CI) 통과 후에만 자동 배포 — 마이그레이션은 여전히 머지 전에 수동 적용(plans/115 C1)
    autoDeployTrigger: checksPass
    # 시작 명령은 backend/Dockerfile CMD 한 곳에서만 관리한다(plans/116 D4)
    envVars:
      - key: APP_ENV
        value: production
      - key: KIS_CRED_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_PROJECT_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DART_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: METRICS_TOKEN
        sync: false
      - key: FRED_API_KEY
        sync: false
      # 아래 둘은 선택 — 비우면 Sentry·FCM 푸시 비활성.
      # Sentry release는 Render가 주입하는 RENDER_GIT_COMMIT으로 자동 설정된다(config.py)
      - key: SENTRY_DSN
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
