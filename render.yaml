services:
  - type: web
    name: growlio-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    preDeployCommand: python scripts/bootstrap_alembic.py && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: APP_ENV
        value: production
      - key: KIS_CRED_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_PROJECT_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DART_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: METRICS_TOKEN
        sync: false
      - key: FRED_API_KEY
        sync: false
      # 아래 셋은 선택 — 비우면 Sentry·FCM 푸시 비활성, 마이그레이션은 DATABASE_URL 사용.
      # Sentry release는 Render가 주입하는 RENDER_GIT_COMMIT으로 자동 설정된다(config.py)
      - key: SENTRY_DSN
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
