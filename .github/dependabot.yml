version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      # minor/patch는 한 PR로 묶는다. major는 개별 PR로 남겨 건별 검토
      # (structlog 25→26, pytest 등 상한 없는 major 포함).
      backend-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # pyproject.toml이 일부러 건 상한과 일치 — 상한을 넘는 업데이트는 알림도 만들지 않는다
      # (버전 올릴 땐 pyproject.toml 상한을 먼저 넓히면 Dependabot이 다시 알림).
      # yfinance: 비공식 스크래핑 기반이라 minor도 breaking 잦음 → 0.2.x 패치만
      - dependency-name: "yfinance"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # ruff: 0.x 릴리스라 minor(0.15→0.16)가 사실상 breaking(새 lint 룰) → 0.15.x 패치만
      - dependency-name: "ruff"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "tenacity"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "cryptography"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "firebase-admin"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      # react-types가 먼저 매칭되도록 frontend-dependencies보다 위에 둔다.
      react-types:
        patterns:
          - "@types/react"
          - "@types/react-dom"
      # minor/patch는 한 PR로 묶는다. major(recharts 3, tailwind 4, zustand 5,
      # lucide-react, @sentry/react)는 개별 PR 유지 — docs/plans/20 #5 로드맵이
      # "하나씩 별도 PR로 검증"을 원함. @capacitor/* minor는 이 그룹으로 묶여 함께 올라감.
      # react/react-dom/typescript major는 아래 ignore로 보류(React 18 고정).
      # @vitejs/plugin-react 6·vite major도 ignore — Rolldown 전환 검증이 필요해 건별 처리.
      frontend-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # React 19 미채택 — 프로젝트는 React 18에 고정(react-dom/@types/react-dom도 18).
      # @types/react만 막으면 Dependabot이 react major PR에 @types/react를 "함께" 끌어와
      # 부분 major 조합(react 19 + react-dom 18)이 되어 npm ERESOLVE로 CI가 깨진다.
      # → react/react-dom 자체의 major를 막아야 조합 PR이 생기지 않는다.
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react-dom"
        update-types:
          - "version-update:semver-major"
      # @vitejs/plugin-react 6은 oxc-transform/@rolldown/plugin-babel 피어로 재설계됨 →
      # 현재 5.x(vite 8 지원, React 18 유지)에 고정, 6 major는 건별 검증.
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - "version-update:semver-major"
      # vite 8부터 번들러가 Rollup → Rolldown으로 교체됨(vite.config.ts manualChunks →
      # advancedChunks 등 마이그레이션 수반) → major 자동 PR 보류, 건별로 올린다.
      - dependency-name: "vite"
        update-types:
          - "version-update:semver-major"
      # TypeScript 7(네이티브 포트)은 별도 검증 필요 — major 자동 PR 보류
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      # minor/patch는 한 PR로. major(checkout v7, setup-python v7, setup-uv v9, cache v6)는
      # 개별 PR로 남겨 SHA 재핀 + 러너 호환(node24)을 건별로 확인.
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
