version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    groups:
      # minor/patch는 한 PR로 묶는다. major는 개별 PR로 남겨 건별 검토
      # (structlog·pytest 포함 모든 의존성에 pyproject 상한이 있다 — 상한을 넘는 major는 상한을 먼저 넓혀 검토).
      backend-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # pyproject.toml이 일부러 건 상한과 일치 — 상한을 넘는 업데이트는 알림도 만들지 않는다
      # (버전 올릴 땐 pyproject.toml 상한을 먼저 넓히면 Dependabot이 다시 알림).
      # yfinance: 비공식 스크래핑 기반이라 minor도 breaking 잦음 → 0.2.x 패치만
      - dependency-name: "yfinance"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # ruff: 0.x 릴리스라 minor(0.15→0.16)가 사실상 breaking(새 lint 룰) → 0.15.x 패치만
      - dependency-name: "ruff"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # tenacity: pyproject 상한(<9)과 일치 — 재시도 데코레이터를 5개 모듈에서 쓰므로 9.x는
      # 상한을 넓히고 재시도 테스트를 확인하는 별도 PR로 올린다
      - dependency-name: "tenacity"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "cryptography"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "firebase-admin"
        update-types:
          - "version-update:semver-major"
      # pandas major: pykrx(<2.0)가 "pandas<3.0"을 요구 → pandas 3.x로 올리면 uv가
      # pykrx를 1.2.8→1.0.51로 강제 다운그레이드하는데, 이 구버전이 pkg_resources(setuptools)
      # 의존 코드를 갖고 있어 CI가 ModuleNotFoundError로 깨짐(PR #81). pykrx 쪽 pandas 3
      # 지원이 먼저 필요 — 건별 검토 전까지 보류.
      - dependency-name: "pandas"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      # react-types가 먼저 매칭되도록 frontend-dependencies보다 위에 둔다.
      react-types:
        patterns:
          - "@types/react"
          - "@types/react-dom"
      # vitest / @vitest/* 는 서로 exact-version 피어 의존(@vitest/ui, @vitest/coverage-v8가
      # vitest 정확한 버전을 peer로 요구) → 하나씩 올리면 npm ERESOLVE로 CI(npm ci)가 깨진다.
      # major 포함해 한 PR로 묶어 함께 올린다(테스트 러너 전용이라 prod 번들 영향 없음).
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "minor"
          - "patch"
          - "major"
      # minor/patch는 한 PR로 묶는다. major(recharts 3, tailwind 4,
      # lucide-react, @sentry/react)는 개별 PR 유지 — docs/plans/20 #5 로드맵이
      # "하나씩 별도 PR로 검증"을 원함. @capacitor/* minor는 이 그룹으로 묶여 함께 올라감.
      # react/react-dom/typescript major는 아래 ignore로 보류(React 18 고정).
      # @vitejs/plugin-react 6·vite major도 ignore — Rolldown 전환 검증이 필요해 건별 처리.
      frontend-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # React 19 미채택 — 프로젝트는 React 18에 고정(react-dom/@types/react-dom도 18).
      # @types/react만 막으면 Dependabot이 react major PR에 @types/react를 "함께" 끌어와
      # 부분 major 조합(react 19 + react-dom 18)이 되어 npm ERESOLVE로 CI가 깨진다.
      # → react/react-dom 자체의 major를 막아야 조합 PR이 생기지 않는다.
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/react-dom"
        update-types:
          - "version-update:semver-major"
      # @vitejs/plugin-react 6은 oxc-transform/@rolldown/plugin-babel 피어로 재설계됨 →
      # 현재 5.x(vite 8 지원, React 18 유지)에 고정, 6 major는 건별 검증.
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - "version-update:semver-major"
      # vite major는 번들러·설정 변경이 잦다(7→8에서 Rollup → Rolldown 전환, manualChunks →
      # advancedChunks 마이그레이션 — 2026-09 수동 완료) → major 자동 PR 보류, 건별로 올린다.
      - dependency-name: "vite"
        update-types:
          - "version-update:semver-major"
      # TypeScript 7(네이티브 포트)은 별도 검증 필요 — major 자동 PR 보류
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      # minor/patch는 한 PR로. major(checkout·setup-python·setup-uv·cache 등 현재 핀 다음 major)는
      # 개별 PR로 남겨 SHA 재핀 + 러너 호환(node24)을 건별로 확인. 현재 버전은 워크플로의 `# vN` 주석 참고.
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
