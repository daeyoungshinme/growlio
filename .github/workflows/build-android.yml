name: Android APK Build

# Gradle은 `npx cap sync android`가 생성하는 파일(capacitor.settings.gradle의 플러그인 항목,
# capacitor-cordova-android-plugins/)과 node_modules/@capacitor/* 소스를 직접 참조한다 —
# 웹 빌드·cap sync·Gradle은 반드시 같은 잡(같은 체크아웃) 안에서 실행해야 한다.
#
# 필요한 저장소 설정 (Settings › Secrets and variables › Actions):
#   Variables: VITE_API_DOMAIN, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_REDIRECT_URL,
#              VITE_SENTRY_DSN(선택)
#   Secrets(release만): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#              ANDROID_KEY_PASSWORD

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'debug'
        type: choice
        options: [debug, release, both]
  push:
    tags: ['v*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BUILD_DEBUG: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both') }}
      BUILD_RELEASE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both')) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'  # ci.yml과 같은 LTS major
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Check build-time variables
        env:
          VITE_API_DOMAIN: ${{ vars.VITE_API_DOMAIN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_REDIRECT_URL: ${{ vars.VITE_REDIRECT_URL }}
        # 비어 있으면 앱이 localhost:8000 / 빈 Supabase를 가리키는 APK가 조용히 만들어진다.
        # VITE_REDIRECT_URL이 비면 가입·비밀번호 재설정 메일 링크가 "undefined/..."가 된다(plans/115 B3)
        run: |
          missing=""
          for name in VITE_API_DOMAIN VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_REDIRECT_URL; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::저장소 Variables 누락:$missing"
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build web assets
        working-directory: frontend
        env:
          VITE_API_DOMAIN: ${{ vars.VITE_API_DOMAIN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_REDIRECT_URL: ${{ vars.VITE_REDIRECT_URL }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
        run: npm run build

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('frontend/android/**/*.gradle*', 'frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Debug APK
        if: env.BUILD_DEBUG == 'true'
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        if: env.BUILD_DEBUG == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: growlio-debug-${{ github.sha }}
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Decode Keystore
        if: env.BUILD_RELEASE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # 비어 있으면 빈 키스토어로 Gradle 서명 단계에서 알기 어려운 오류가 난다 — Variables 검사와 같은 방식
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::저장소 Secrets 누락:$missing"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/growlio.keystore

      - name: Build Release APK
        if: env.BUILD_RELEASE == 'true'
        working-directory: frontend/android
        env:
          KEYSTORE_PATH: /tmp/growlio.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK
        if: env.BUILD_RELEASE == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: growlio-release-${{ github.ref_name }}-${{ github.sha }}
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

  # tag 빌드의 서명 APK는 GitHub Release에 첨부한다 — artifact는 30일 뒤 사라져 옛 릴리스를 다시 받을 수 없었다(plans/116 D2).
  # 쓰기 권한은 키스토어 Secrets를 다루는 빌드 잡과 분리한다.
  publish-release:
    name: Attach APK to GitHub Release
    needs: build-apk
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: growlio-release-${{ github.ref_name }}-${{ github.sha }}
          path: apk

      - name: Rename APK
        run: mv apk/app-release.apk "apk/growlio-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: apk/growlio-${{ github.ref_name }}.apk
          generate_release_notes: true
