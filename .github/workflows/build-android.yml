name: Android APK Build

# Gradle은 `npx cap sync android`가 생성하는 파일(capacitor.settings.gradle의 플러그인 항목,
# capacitor-cordova-android-plugins/)과 node_modules/@capacitor/* 소스를 직접 참조한다 —
# 웹 빌드·cap sync·Gradle은 반드시 같은 잡(같은 체크아웃) 안에서 실행해야 한다.
#
# 필요한 저장소 설정 (Settings › Secrets and variables › Actions):
#   Variables: VITE_API_DOMAIN, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_REDIRECT_URL,
#              VITE_SENTRY_DSN(선택)
#   Secrets(release만): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#              ANDROID_KEY_PASSWORD

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'debug'
        type: choice
        options: [debug, release, both]
  push:
    tags: ['v*']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      BUILD_DEBUG: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both') }}
      BUILD_RELEASE: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both')) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Check build-time variables
        env:
          VITE_API_DOMAIN: ${{ vars.VITE_API_DOMAIN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        # 비어 있으면 앱이 localhost:8000 / 빈 Supabase를 가리키는 APK가 조용히 만들어진다
        run: |
          missing=""
          for name in VITE_API_DOMAIN VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::저장소 Variables 누락:$missing"
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build web assets
        working-directory: frontend
        env:
          VITE_API_DOMAIN: ${{ vars.VITE_API_DOMAIN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_REDIRECT_URL: ${{ vars.VITE_REDIRECT_URL }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
        run: npm run build

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync android

      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('frontend/android/**/*.gradle*', 'frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Debug APK
        if: env.BUILD_DEBUG == 'true'
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK
        if: env.BUILD_DEBUG == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: growlio-debug-${{ github.sha }}
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Decode Keystore
        if: env.BUILD_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/growlio.keystore

      - name: Build Release APK
        if: env.BUILD_RELEASE == 'true'
        working-directory: frontend/android
        env:
          KEYSTORE_PATH: /tmp/growlio.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK
        if: env.BUILD_RELEASE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: growlio-release-${{ github.ref_name }}-${{ github.sha }}
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
