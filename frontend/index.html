<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Growlio — 자산관리 대시보드</title>
    <meta name="theme-color" content="#2563EB" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Growlio" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="preconnect" href="https://growlio-api.onrender.com" />
    <link rel="dns-prefetch" href="https://growlio-api.onrender.com" />
  </head>
  <body>
    <div id="root">
      <style>
        #boot-loader {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #f9fafb;
        }
        @media (prefers-color-scheme: dark) {
          #boot-loader {
            background: #111827;
          }
        }
        #boot-loader-spinner {
          width: 36px;
          height: 36px;
          border-radius: 50%;
          border: 3px solid rgba(37, 99, 235, 0.2);
          border-top-color: #2563eb;
          animation: boot-loader-spin 0.8s linear infinite;
        }
        @keyframes boot-loader-spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
      <div id="boot-loader">
        <div id="boot-loader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
